<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>神経衰弱ゲーム3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&display=swap");

    :root {
      --card-dark: #111827;
      --card-mid: #1f2933;
      --accent: #34d399;
      --card-min: 110px;
    }

    body {
      font-family: "Noto Serif JP", serif;
      background: radial-gradient(circle at 20% 20%, rgba(52, 211, 153, 0.08), transparent 30%),
        radial-gradient(circle at 80% 0%, rgba(96, 165, 250, 0.1), transparent 28%),
        #0a0a0f;
      color: #e5e7eb;
      overscroll-behavior: none;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(var(--card-min), 1fr));
      gap: 12px;
      width: 100%;
    }

    .card {
      position: relative;
      aspect-ratio: 3 / 4;
      perspective: 1000px;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .card-inner {
      position: absolute;
      inset: 0;
      transition: transform 0.45s ease;
      transform-style: preserve-3d;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    }

    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .card-back {
      background: linear-gradient(145deg, #1f2933, #0f172a);
      border: 1px solid #2e3745;
      color: #9ca3af;
    }

    .card-front {
      background: linear-gradient(160deg, rgba(52, 211, 153, 0.18), rgba(34, 211, 238, 0.14)),
        #0f172a;
      border: 1px solid #34d399;
      transform: rotateY(180deg);
      color: #f9fafb;
    }

    .card.matched .card-front {
      border-color: #22c55e;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.6);
    }

    .card.matched.p1-win .card-front {
      border-color: #22c55e;
      box-shadow: 0 0 14px rgba(34, 197, 94, 0.8);
    }

    .card.matched.p2-win .card-front {
      border-color: #60a5fa;
      box-shadow: 0 0 14px rgba(96, 165, 250, 0.8);
    }

    .card-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge {
      background: rgba(52, 211, 153, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.35);
      color: #a7f3d0;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 0.8rem;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #1f2933;
      color: #e5e7eb;
      padding: 20px;
      border-radius: 10px;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid #334155;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    .config-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(31, 41, 51, 0.6);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #2f3b4a;
    }

    .config-item > label {
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    .config-group-title {
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 1rem;
    }

    .player-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(52, 211, 153, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.35);
      color: #a7f3d0;
      padding: 4px 10px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.9rem;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .player-chip.active {
      background: rgba(52, 211, 153, 0.35);
      color: #ecfdf3;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(52, 211, 153, 0.25);
    }

    .menu-panel {
      position: fixed;
      right: 0;
      top: 0;
      width: 340px;
      max-width: 90vw;
      height: 100vh;
      background: #0f172a;
      border-left: 1px solid #1f2937;
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
      padding: 16px;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.25s ease;
      z-index: 60;
    }

    .menu-panel.active {
      transform: translateX(0);
    }

    .menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 50;
      display: none;
    }

    .menu-overlay.active {
      display: block;
    }
  </style>
</head>
<body class="min-h-screen flex justify-center py-6">
  <div class="w-full max-w-5xl px-3">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
      <div>
        <h1 class="text-2xl font-bold tracking-wide">神経衰弱</h1>
        <p class="text-sm text-gray-400">画像はURLかアップロードで差し替えできます</p>
      </div>
      <div class="flex gap-2">
        <button onclick="toggleMenu(true)" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded border border-slate-600 text-sm">メニュー</button>
        <button onclick="openSettings()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded border border-slate-500 text-sm">画像設定</button>
      </div>
    </div>

    <div class="bg-slate-900/70 rounded-lg p-3 border border-slate-700 mb-4">
      <div class="flex flex-wrap gap-3 items-center text-sm">
        <div class="flex items-center gap-2">
          <span class="text-gray-300">ターン</span>
          <span id="currentPlayerLabel" class="player-chip active">プレイヤー1</span>
        </div>
        <div class="flex items-center gap-2">
          <span id="player1Chip" class="player-chip active">P1</span>
          <span id="player1Score" class="font-semibold">0</span>
        </div>
        <div class="flex items-center gap-2">
          <span id="player2Chip" class="player-chip">P2</span>
          <span id="player2Score" class="font-semibold">0</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-gray-300">ペア数</span>
          <span id="pairCountLabel" class="badge"></span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-gray-300">手数</span>
          <span id="movesDisplay" class="font-semibold">0</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-gray-300">揃ったペア</span>
          <span id="matchesDisplay" class="font-semibold">0 / 0</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-gray-300">経過時間</span>
          <span id="timeDisplay" class="font-semibold">00:00</span>
        </div>
      </div>
    </div>

    <div id="playArea" class="rounded-xl border border-slate-800 bg-gradient-to-br from-slate-950 via-slate-900 to-black p-5 shadow-xl transition-colors">
      <div id="cardGrid" class="card-grid min-h-[400px]"></div>
    </div>

    <div id="messageArea" class="mt-4 bg-slate-900/70 border border-slate-700 rounded-lg p-3 text-sm min-h-[72px]"></div>
  </div>

  <div id="menuOverlay" class="menu-overlay" onclick="toggleMenu(false)"></div>
  <div id="menuPanel" class="menu-panel">
    <div class="flex items-start justify-between mb-3">
      <div>
        <h3 class="text-lg font-bold">メニュー</h3>
        <p class="text-xs text-gray-400">ペア数やリスタートなどはこちらから</p>
      </div>
      <button onclick="toggleMenu(false)" class="text-gray-300 hover:text-white">✕</button>
    </div>

    <div class="space-y-3">
      <div class="bg-slate-900/70 rounded-lg p-3 border border-slate-700">
        <div class="flex justify-between text-sm mb-2">
          <span>ペア数</span>
          <span id="pairCountLabelMenu" class="badge"></span>
        </div>
        <input id="pairCountInput" type="range" min="4" max="24" value="8" class="w-full accent-emerald-400"
          oninput="handlePairCountChange(this.value)" />
      </div>

      <div class="bg-slate-900/70 rounded-lg p-3 border border-slate-700 space-y-2">
        <button onclick="restartGame(); toggleMenu(false);" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded">リスタート</button>
        <button onclick="revealAll(); toggleMenu(false);" class="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded">1秒だけ全オープン</button>
        <p class="text-xs text-gray-400">最初のカードをめくるとタイマーが動きます。</p>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <div class="flex items-start justify-between mb-4">
        <div>
          <h2 class="text-xl font-bold">カード画像をカスタマイズ</h2>
          <p class="text-sm text-gray-400">URLを入れるか、画像ファイルをアップロードできます。空欄にするとデフォルトの絵文字に戻ります。</p>
        </div>
        <button onclick="closeSettings()" class="text-gray-300 hover:text-white">✕</button>
      </div>

      <div class="space-y-4" id="imageSettingsList"></div>

      <div class="flex justify-end gap-2 mt-4">
        <button onclick="closeSettings()" class="px-4 py-2 rounded bg-slate-700 hover:bg-slate-600">キャンセル</button>
        <button onclick="saveSettings()" class="px-4 py-2 rounded bg-emerald-600 text-white hover:bg-emerald-500">保存して反映</button>
      </div>
      <div class="text-right text-xs text-amber-300 mt-2">大きすぎる画像は保存できない場合があります。</div>
    </div>
  </div>

  <script>
    const DEFAULT_FACES = [
      "🍎",
      "🍇",
      "🍋",
      "🍒",
      "🍓",
      "🍍",
      "🥝",
      "🍉",
      "🥕",
      "🥑",
      "🥨",
      "🍣",
      "🎲",
      "🎧",
      "🧩",
      "🚀"
    ];
    const MAX_PAIRS = 24;
    const STORAGE_KEY = "memoryCustomImagesV1";
    const PLAYERS = ["プレイヤー1", "プレイヤー2"];

    let pairCount = 8;
    let deck = [];
    let flipped = [];
    let lockBoard = false;
    let moves = 0;
    let matches = 0;
    let startTime = null;
    let timerId = null;
    let customImages = {};
    let currentPlayer = 0;
    let scores = [0, 0];
    let movesPerPlayer = [0, 0];

    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        customImages = JSON.parse(saved);
      }
    } catch (e) {
      console.warn("画像設定の読み込みに失敗しました", e);
      customImages = {};
    }

    window.onload = () => {
      document.getElementById("pairCountInput").value = pairCount;
      updatePairLabel();
      restartGame();
    };

    function handlePairCountChange(value) {
      pairCount = Number(value);
      updatePairLabel();
      restartGame();
    }

    function updatePairLabel() {
      const label = document.getElementById("pairCountLabel");
      const menuLabel = document.getElementById("pairCountLabelMenu");
      label.textContent = `${pairCount} ペア`;
      if (menuLabel) menuLabel.textContent = `${pairCount} ペア`;
      document.getElementById("matchesDisplay").textContent = `${matches} / ${pairCount}`;
    }

    function restartGame() {
      stopTimer();
      startTime = null;
      moves = 0;
      matches = 0;
      scores = [0, 0];
      movesPerPlayer = [0, 0];
      currentPlayer = 0;
      flipped = [];
      lockBoard = false;
      buildDeck();
      renderGrid();
      updateStats();
      setMessage(`${PLAYERS[currentPlayer]} のターンです。カードをめくってスタート！`);
      revealAll(true);
    }

    function buildDeck() {
      const faces = [];
      for (let i = 1; i <= pairCount; i++) {
        faces.push({ key: `card_${i}`, label: DEFAULT_FACES[(i - 1) % DEFAULT_FACES.length] });
      }

      deck = faces.flatMap((face) => [
        { id: `${face.key}-a`, key: face.key, label: face.label, matched: false, flipped: false, matchedBy: null },
        { id: `${face.key}-b`, key: face.key, label: face.label, matched: false, flipped: false, matchedBy: null },
      ]);

      // シャッフル (Fisher–Yates)
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }

      updateCardSizing();
    }

    function renderGrid() {
      const grid = document.getElementById("cardGrid");
      grid.innerHTML = "";

      deck.forEach((card, index) => {
        const classes = ["card"];
        if (card.flipped || card.matched) classes.push("flipped");
        if (card.matched) {
          classes.push("matched");
          if (card.matchedBy === 0) classes.push("p1-win");
          if (card.matchedBy === 1) classes.push("p2-win");
        }
        const cardEl = document.createElement("div");
        cardEl.className = classes.join(" ");
        cardEl.onclick = () => handleCardClick(index);

        const inner = document.createElement("div");
        inner.className = "card-inner";

        const back = createFace("back", { key: "card_back", label: "?" });
        const front = createFace("front", { key: card.key, label: card.label });

        inner.appendChild(back);
        inner.appendChild(front);
        cardEl.appendChild(inner);
        grid.appendChild(cardEl);
      });

      applyBoardImage();
      updateCardSizing();
    }

    function createFace(side, data) {
      const face = document.createElement("div");
      face.className = `card-face card-${side}`;
      const url = getImage(data.key);

      if (url) {
        const img = document.createElement("img");
        img.src = url;
        img.alt = "card";
        face.appendChild(img);
      } else {
        const span = document.createElement("span");
        span.textContent = data.label;
        face.appendChild(span);
      }

      return face;
    }

    function getImage(key) {
      return customImages[key] || null;
    }

    function handleCardClick(index) {
      if (lockBoard) return;
      const card = deck[index];
      if (card.matched || card.flipped) return;

      if (!startTime) startTimer();

      card.flipped = true;
      flipped.push(index);
      renderGrid();

      if (flipped.length === 2) {
        moves++;
        movesPerPlayer[currentPlayer]++;
        const [a, b] = flipped;
        const first = deck[a];
        const second = deck[b];

        if (first.key === second.key) {
          first.matched = true;
          second.matched = true;
          first.matchedBy = currentPlayer;
          second.matchedBy = currentPlayer;
          matches++;
          scores[currentPlayer]++;
          flipped = [];
          updateStats();
          if (matches === pairCount) {
            stopTimer();
            const timeText = document.getElementById("timeDisplay").textContent;
            const result =
              scores[0] === scores[1]
                ? "引き分け！"
                : `${scores[0] > scores[1] ? PLAYERS[0] : PLAYERS[1]} の勝ち！`;
            setMessage(`${result} 手数: ${moves} / 時間: ${timeText}`);
          } else {
            setMessage(`${PLAYERS[currentPlayer]} がペアを揃えました！ もう一度どうぞ。`);
          }
        } else {
          lockBoard = true;
          setTimeout(() => {
            first.flipped = false;
            second.flipped = false;
            flipped = [];
            lockBoard = false;
            currentPlayer = currentPlayer === 0 ? 1 : 0;
            renderGrid();
            updateStats();
            setMessage(`${PLAYERS[currentPlayer]} のターンです。`);
          }, 900);
        }

        updateStats();
      }
    }

    function updateStats() {
      document.getElementById("movesDisplay").textContent = moves;
      document.getElementById("matchesDisplay").textContent = `${matches} / ${pairCount}`;
      document.getElementById("player1Score").textContent = scores[0];
      document.getElementById("player2Score").textContent = scores[1];
      const p1Chip = document.getElementById("player1Chip");
      const p2Chip = document.getElementById("player2Chip");
      if (p1Chip && p2Chip) {
        p1Chip.classList.toggle("active", currentPlayer === 0);
        p2Chip.classList.toggle("active", currentPlayer === 1);
      }
      const turnLabel = document.getElementById("currentPlayerLabel");
      if (turnLabel) {
        turnLabel.textContent = `${PLAYERS[currentPlayer]} のターン`;
        turnLabel.classList.toggle("active", true);
      }
      updatePairLabel();
    }

    function updateCardSizing() {
      const root = document.documentElement;
      let size = "110px";
      if (pairCount > 16 && pairCount <= 20) {
        size = "88px";
      } else if (pairCount > 20) {
        size = "76px";
      } else if (pairCount > 12) {
        size = "95px";
      }
      root.style.setProperty("--card-min", size);

      const grid = document.getElementById("cardGrid");
      if (grid) {
        grid.style.minHeight = pairCount > 16 ? "50vh" : "40vh";
      }
      const playArea = document.getElementById("playArea");
      if (playArea) {
        playArea.style.minHeight = pairCount > 16 ? "70vh" : "55vh";
      }
    }

    function startTimer() {
      startTime = Date.now();
      timerId = setInterval(() => {
        const diff = Date.now() - startTime;
        document.getElementById("timeDisplay").textContent = formatTime(diff);
      }, 500);
    }

    function stopTimer() {
      if (timerId) clearInterval(timerId);
      timerId = null;
    }

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
      const seconds = String(totalSeconds % 60).padStart(2, "0");
      return `${minutes}:${seconds}`;
    }

    function revealAll(autoClose = false) {
      if (lockBoard) return;
      lockBoard = true;
      deck.forEach((c) => (c.flipped = true));
      renderGrid();
      if (autoClose) {
        setTimeout(() => {
          deck.forEach((c) => {
            if (!c.matched) c.flipped = false;
          });
          lockBoard = false;
          renderGrid();
        }, 900);
      } else {
        setTimeout(() => {
          deck.forEach((c) => {
            if (!c.matched) c.flipped = false;
          });
          lockBoard = false;
          renderGrid();
        }, 1000);
      }
    }

    function setMessage(msg) {
      document.getElementById("messageArea").textContent = msg;
    }

    function applyBoardImage() {
      const area = document.getElementById("playArea");
      if (customImages.board) {
        area.style.backgroundImage = `linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.75)), url(${customImages.board})`;
        area.style.backgroundSize = "cover";
        area.style.backgroundPosition = "center";
      } else {
        area.style.backgroundImage = "";
      }
    }

    function toggleMenu(show) {
      const panel = document.getElementById("menuPanel");
      const overlay = document.getElementById("menuOverlay");
      if (!panel || !overlay) return;
      if (show) {
        panel.classList.add("active");
        overlay.classList.add("active");
      } else {
        panel.classList.remove("active");
        overlay.classList.remove("active");
      }
    }

    // 設定モーダル周り
    function dataURItoBlob(dataURI) {
      const byteString = atob(dataURI.split(",")[1]);
      const mimeString = dataURI.split(",")[0].split(":")[1].split(";")[0];
      const ab = new ArrayBuffer(byteString.length);
      const ia = new Uint8Array(ab);
      for (let i = 0; i < byteString.length; i++) {
        ia[i] = byteString.charCodeAt(i);
      }
      return new Blob([ab], { type: mimeString });
    }

    function createUrlInput(key, fileInput) {
      const urlInput = document.createElement("input");
      urlInput.type = "text";
      urlInput.placeholder = "画像URL (例: https://...)";
      urlInput.dataset.key = key;
      urlInput.className = "w-full p-2 rounded bg-slate-700 text-white text-sm border border-slate-600";
      urlInput.value = customImages[key] || "";

      urlInput.oninput = () => {
        if (urlInput.value.trim()) {
          fileInput.disabled = true;
        } else {
          fileInput.disabled = false;
        }
      };

      return urlInput;
    }

    function createFileUploader(key, urlInput) {
      const fileInput = document.createElement("input");
      fileInput.type = "file";
      fileInput.accept = "image/*";
      fileInput.className = "w-full text-sm text-gray-300";

      if (urlInput.value.trim()) {
        fileInput.disabled = true;
      }

      fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            urlInput.value = event.target.result;
            urlInput.dispatchEvent(new Event("input"));
          };
          reader.readAsDataURL(file);
        }
      };

      return fileInput;
    }

    function openSettings() {
      const list = document.getElementById("imageSettingsList");
      list.innerHTML = "";

      const boardGroup = document.createElement("div");
      boardGroup.className = "config-item";
      boardGroup.innerHTML = `<div class="config-group-title">プレイエリア背景</div>`;
      const boardUrlInput = createUrlInput("board", document.createElement("input"));
      boardUrlInput.placeholder = "背景画像URL";
      const boardFileInput = createFileUploader("board", boardUrlInput);
      boardGroup.appendChild(boardUrlInput);
      boardGroup.appendChild(boardFileInput);
      list.appendChild(boardGroup);

      const backGroup = document.createElement("div");
      backGroup.className = "config-item";
      backGroup.innerHTML = `<div class="config-group-title">カード裏面</div>`;
      const backUrlInput = createUrlInput("card_back", document.createElement("input"));
      backUrlInput.placeholder = "カード裏面URL";
      const backFileInput = createFileUploader("card_back", backUrlInput);
      backGroup.appendChild(backUrlInput);
      backGroup.appendChild(backFileInput);
      list.appendChild(backGroup);

      for (let i = 1; i <= MAX_PAIRS; i++) {
        const key = `card_${i}`;
        const group = document.createElement("div");
        group.className = "config-item";
        group.innerHTML = `<div class="config-group-title">ペア ${i}</div>`;

        const urlInput = createUrlInput(key, document.createElement("input"));
        const fileInput = createFileUploader(key, urlInput);
        group.appendChild(urlInput);
        group.appendChild(fileInput);
        list.appendChild(group);
      }

      document.getElementById("settingsModal").classList.add("active");
    }

    function closeSettings() {
      document.getElementById("settingsModal").classList.remove("active");
    }

    function saveSettings() {
      const inputs = document.querySelectorAll('#imageSettingsList input[type="text"]');
      inputs.forEach((input) => {
        const key = input.dataset.key;
        const val = input.value.trim();
        if (val) {
          customImages[key] = val;
        } else {
          delete customImages[key];
        }
      });

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(customImages));
      } catch (e) {
        console.error("画像設定を保存できませんでした。サイズを小さくするかURL指定にしてください。", e);
      }

      closeSettings();
      renderGrid();
    }
  </script>
</body>
</html>
